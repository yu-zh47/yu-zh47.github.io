title: Personal Notes
author: Yue Zhao
lang: en
timezone: America/Los_Angeles
permalink: /writing/:title/
defaults:
  - scope:
      path: ""
    values:
      lang: en
  - scope:
      path: ""
      type: posts
    values:
      layout: article
  - scope:
      path: "zh"
    values:
      lang: zh-CN
  - scope:
      path: "zh"
      type: posts
    values:
      permalink: /zh/writing/:title/
exclude:
  - README.md
