<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }}{% if page.subtitle %}：{{ page.subtitle | escape }}{% endif %} · {% endif %}{{ site.author }} · {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: 'Yue Zhao 的个人札记。' | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body id="top">
  <a class="skip" href="#main">跳到正文</a>
  <header class="masthead shell">
    <a class="wordmark" href="{{ '/' | relative_url }}" lang="en">Yue Zhao<span aria-hidden="true">.</span></a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>文章</a>
      <a href="https://github.com/yu-zh47" lang="en">GitHub</a>
    </nav>
  </header>
  {{ content }}
  <footer class="footer shell">
    <span>Yue Zhao <span aria-hidden="true">/</span> {{ site.title }}</span>
    <a href="#top">回到顶部</a>
  </footer>
</body>
</html>
